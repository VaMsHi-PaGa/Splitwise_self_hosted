version: '3.8'

services:
  db:
    image: postgres:16
    container_name: splitsmart-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-splitsmart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-splitsmart}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-splitsmart}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - splitsmart-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: splitsmart-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-splitsmart}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-splitsmart}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      SEED_DEMO: ${SEED_DEMO:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      PORT: 8000
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - splitsmart-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: splitsmart-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - backend
    networks:
      - splitsmart-network

  nginx:
    image: nginx:alpine
    container_name: splitsmart-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - splitsmart-network

  certbot:
    image: certbot/certbot
    container_name: splitsmart-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  pgdata:
  uploads:

networks:
  splitsmart-network:
    driver: bridge
