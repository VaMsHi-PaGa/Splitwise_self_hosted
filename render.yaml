services:
  - type: web
    name: splitsmart-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: splitsmart-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: 1440
      - key: SEED_DEMO
        value: false
      - key: CORS_ORIGINS
        value: https://splitdengurapuka.netlify.app

databases:
  - name: splitsmart-db
    plan: free
    databaseName: splitsmart
    user: splitsmart
